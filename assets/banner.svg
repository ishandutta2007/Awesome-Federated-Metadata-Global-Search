<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0c1228"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3"/>
    </pattern>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .node-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-pulse-2 {
        animation: pulse 4s ease-in-out infinite alternate 2s;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dash 25s linear infinite;
      }
      .flow-line-rev {
        stroke-dasharray: 6, 6;
        animation: dash-rev 20s linear infinite;
      }
      .ring-rotate {
        transform-origin: 980px 200px;
        animation: rotate 30s linear infinite;
      }
      .particle-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dash-rev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes float {
        0% { transform: translateY(0px) scale(0.95); opacity: 0.4; }
        100% { transform: translateY(-15px) scale(1.05); opacity: 0.85; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="160" fill="url(#glowGrad1)" filter="url(#glow)" class="particle-float"/>
  <circle cx="1050" cy="220" r="200" fill="url(#glowGrad2)" filter="url(#glow)" class="particle-float" style="animation-delay: -3s;"/>
  <circle cx="600" cy="350" r="180" fill="url(#glowGrad1)" filter="url(#glow)" class="particle-float" style="animation-delay: -1.5s;"/>

  <!-- Network / Federated Mesh Lines (Background Dynamic Layer) -->
  <g opacity="0.45">
    <!-- Connecting routes to central query node -->
    <path d="M 820 100 C 900 130, 930 160, 980 200" fill="none" stroke="#60a5fa" stroke-width="1.8" class="flow-line"/>
    <path d="M 1120 110 C 1070 140, 1020 170, 980 200" fill="none" stroke="#a78bfa" stroke-width="1.8" class="flow-line-rev"/>
    <path d="M 830 300 C 890 280, 930 250, 980 200" fill="none" stroke="#38bdf8" stroke-width="1.8" class="flow-line"/>
    <path d="M 1130 290 C 1080 270, 1020 240, 980 200" fill="none" stroke="#818cf8" stroke-width="1.8" class="flow-line-rev"/>
    <path d="M 980 60 L 980 200" fill="none" stroke="#c084fc" stroke-width="1.8" class="flow-line"/>
    <path d="M 980 340 L 980 200" fill="none" stroke="#34d399" stroke-width="1.8" class="flow-line-rev"/>

    <!-- Orbital ring around central aggregator -->
    <g class="ring-rotate">
      <circle cx="980" cy="200" r="85" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="8, 12" opacity="0.6"/>
      <circle cx="1065" cy="200" r="4.5" fill="#38bdf8"/>
      <circle cx="895" cy="200" r="4.5" fill="#a855f7"/>
      <circle cx="980" cy="115" r="4.5" fill="#34d399"/>
      <circle cx="980" cy="285" r="4.5" fill="#f43f5e"/>
    </g>

    <!-- Satellite Federated Nodes -->
    <g transform="translate(820, 100)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">SaaS</text>
    </g>
    <g transform="translate(1120, 110)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">SQL</text>
    </g>
    <g transform="translate(830, 300)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">Docs</text>
    </g>
    <g transform="translate(1130, 290)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">Vector</text>
    </g>
    <g transform="translate(980, 60)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.8"/>
      <text x="0" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#e9d5ff" text-anchor="middle">Git</text>
    </g>
    <g transform="translate(980, 340)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="0" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#bae6fd" text-anchor="middle">Cloud</text>
    </g>

    <!-- Central Federated Global Search Core Node -->
    <g transform="translate(980, 200)">
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#818cf8" stroke-width="3" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="34" fill="#1e1b4b" stroke="#60a5fa" stroke-width="1.5"/>
      <path d="M -10 -4 A 12 12 0 1 0 10 -4 A 12 12 0 1 0 -10 -4 M 8 5 L 17 14" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main Foreground Content (Always Crisp & Legible) -->
  <g transform="translate(80, 0)">
    <!-- Badge / Pill -->
    <g transform="translate(0, 68)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981"/>
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#93c5fd" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Title (Gradient & High Contrast) -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
      Federated Metadata
    </text>
    <text x="0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      &amp; Global Search
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Cross-Silo Query Engines &bull; Enterprise Search &bull; Unified Metadata Catalog
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 285)">
      <!-- Pill 1: Zero Data Movement -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">&#x26A1; Zero Data Movement</text>
      </g>

      <!-- Pill 2: Open-Source & SaaS -->
      <g transform="translate(192, 0)">
        <rect width="185" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">&#x1F510; Permission Fidelity</text>
      </g>

      <!-- Pill 3: Hybrid & Vector Ranking -->
      <g transform="translate(389, 0)">
        <rect width="185" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">&#x1F9E0; Hybrid RAG &amp; Vector</text>
      </g>
    </g>
  </g>
</svg>
